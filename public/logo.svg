<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Spoon (left) -->
  <circle cx="20" cy="40" r="8" fill="#7BC142"/>
  <rect x="20" y="40" width="4" height="22" rx="2" fill="#7BC142" transform="translate(-2,0)"/>

  <!-- Fork (right) -->
  <g transform="translate(175, 22)">
    <rect x="-1.5" y="0" width="3" height="20" rx="1.5" fill="#7BC142"/>
    <rect x="-6" y="0" width="2.5" height="14" rx="1.25" fill="#7BC142"/>
    <rect x="3.5" y="0" width="2.5" height="14" rx="1.25" fill="#7BC142"/>
  </g>

  <!-- Arabic text: مقدار -->
  <text x="100" y="42" font-family="'Cairo', 'Tajawal', Arial, sans-serif" font-size="32" font-weight="900" fill="#1A5C2A" text-anchor="middle" direction="rtl">مقدار</text>

  <!-- Subtitle: للوجبات الصحية -->
  <text x="100" y="60" font-family="'Cairo', 'Tajawal', Arial, sans-serif" font-size="12" font-weight="600" fill="#7BC142" text-anchor="middle" direction="rtl">للوجبات الصحية</text>

  <!-- Leaf accent (orange) -->
  <ellipse cx="100" cy="12" rx="6" ry="10" fill="#E8763A" transform="rotate(-15, 100, 12)"/>
  <ellipse cx="110" cy="10" rx="5" ry="9" fill="#E8763A" transform="rotate(15, 110, 10)"/>
</svg>
